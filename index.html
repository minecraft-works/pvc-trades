<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://unpkg.com; connect-src 'self' https://pvc-players.minecraft-works.workers.dev https://pvc-shops.minecraft-works.workers.dev; img-src 'self' https: data: blob:;">
    <title>Shop Listings</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a href="#results" class="skip-link">Skip to results</a>

    <div class="search-container">
        <div class="search-box">
            <div class="search-input-wrapper">
                <label for="searchWant" class="visually-hidden">Search for items to buy</label>
                <input type="text" id="searchWant" placeholder="Buying..." autofocus>
                <button id="clear-search-want" type="button" class="clear-search-btn hidden" title="Clear search" aria-label="Clear buying search">✕</button>
                <button id="add-to-watchlist" type="button" title="Add search to watchlist" aria-label="Add to watchlist">☆</button>
            </div>
            <button id="swap-search" type="button" title="Swap search terms" aria-label="Swap search terms">⇄</button>
            <div class="search-input-wrapper">
                <label for="searchGive" class="visually-hidden">Search by cost item</label>
                <input type="text" id="searchGive" placeholder="Paying...">
                <button id="clear-search-give" type="button" class="clear-search-btn hidden" title="Clear search" aria-label="Clear paying search">✕</button>
            </div>
            <button id="open-dashboard" type="button" title="Daily deals" aria-label="Toggle daily deals dashboard" class="hidden">📊</button>
            <button id="open-matrix" type="button" title="Exchange rates" aria-label="Open exchange rates matrix">💱</button>
            <button id="open-cart" type="button" title="Shopping cart" aria-label="Open shopping cart">
                🛒<span id="cart-badge" class="cart-badge hidden"></span>
            </button>
        </div>
    </div>

    <div id="deals-dashboard" class="deals-dashboard hidden" role="status" aria-label="Daily deals summary">
        <div class="dashboard-header">
            <span class="dashboard-title">📊 Since <span id="dashboard-time-ago"></span></span>
            <button id="dismiss-dashboard" type="button" class="dashboard-dismiss" aria-label="Dismiss">✕</button>
        </div>
        <div id="dashboard-sections" class="dashboard-sections"></div>
    </div>

    <div id="table-container">
        <div id="table-header" role="rowgroup"></div>
        <div id="results" role="rowgroup" aria-live="polite"></div>
    </div>

    <dialog id="matrix-dialog">
        <div id="matrix-container"></div>
    </dialog>

    <dialog id="map-dialog">
        <div id="map-container"></div>
        <button id="close-map" aria-label="Close">&times;</button>
        <span id="map-coords"></span>
    </dialog>

    <dialog id="nav-dialog">
        <div id="nav-dialog-map-container"></div>
        <div id="nav-shop-tooltip" class="nav-shop-tooltip hidden"></div>
        <div id="nav-dialog-distance" class="nav-dialog-distance"></div>
        <button id="nav-follow-toggle" class="nav-follow-toggle" aria-label="Toggle auto-follow" title="Auto-follow enabled">🎯</button>
        <div id="nav-view-controls" class="nav-view-controls">
            <button id="nav-view-mode-toggle" class="nav-view-mode-toggle" aria-label="Toggle auto/manual view world" title="Auto view: follows player world">🔄</button>
            <button id="nav-world-toggle" class="nav-world-toggle" aria-label="Toggle overworld/nether view" title="View: Overworld">🌍</button>
        </div>
        <button id="close-nav" aria-label="Stop navigation">&times;</button>
    </dialog>

    <dialog id="cart-dialog">
        <div class="cart-header">
            <h2>🛒 Shopping Cart</h2>
            <button id="close-cart" aria-label="Close">&times;</button>
        </div>
        <div class="cart-content">
            <!-- Tab Bar -->
            <div class="cart-tabs">
                <button id="tab-cart" class="cart-tab active" data-tab="cart">Cart</button>
                <button id="tab-navigate" class="cart-tab" data-tab="navigate">Route</button>
            </div>
            
            <!-- Cart Tab Content -->
            <div id="tab-content-cart" class="tab-content active">
                <div id="cart-items" class="cart-items"></div>
                <div class="cart-lists">
                    <div class="cart-list-section">
                        <h3>📦 Items</h3>
                        <ul id="cart-gains"></ul>
                    </div>
                    <div class="cart-list-section">
                        <h3>💰 Total Cost</h3>
                        <ul id="cart-costs"></ul>
                    </div>
                </div>
            </div>
            
            <!-- Navigate Tab Content -->
            <div id="tab-content-navigate" class="tab-content">
                <div class="navigate-setup">
                    <p class="navigate-hint">Enter your player name to start live navigation with the route map.</p>
                    <div class="navigate-controls">
                        <input type="text" id="player-name-input" class="player-name-input" placeholder="Player name...">
                    </div>
                </div>
                <div class="cart-route-section">
                    <h3>📍 Route Preview</h3>
                    <div id="nav-timeline" class="route-timeline"></div>
                    <p id="nav-distance" class="route-distance"></p>
                </div>
            </div>
        </div>
        <div class="cart-footer">
            <button id="clear-cart" class="clear-cart-btn hidden">Clear Cart</button>
            <button type="button" id="start-navigation" class="start-nav-btn hidden">Start Navigation</button>
        </div>
    </dialog>

    <dialog id="trade-details-dialog">
        <div class="trade-details-header">
            <h3 id="trade-details-title">Item Details</h3>
            <button id="close-trade-details" aria-label="Close">&times;</button>
        </div>
        <div id="trade-details-content" class="trade-details-content"></div>
    </dialog>

    <dialog id="favorites-dialog">
        <div class="favorites-header">
            <h2>⭐ Watchlist</h2>
            <button id="close-favorites" aria-label="Close">&times;</button>
        </div>
        <div class="favorites-content">
            <div id="favorites-list" class="favorites-list"></div>
            <div id="favorites-empty" class="favorites-empty hidden">
                <p>No items in watchlist</p>
                <p class="favorites-hint">Click ☆ on any trade to start watching</p>
            </div>
        </div>
    </dialog>

    <!-- Favorite popover (positioned dynamically) -->
    <div id="favorite-popover" class="favorite-popover hidden">
        <div class="popover-header">
            <span id="popover-item-name">Item Name</span>
            <button id="popover-close" type="button" class="popover-close" aria-label="Close">&times;</button>
        </div>
        <div class="popover-content">
            <div class="threshold-options">
                <label>
                    <input type="radio" name="threshold-type" value="any" checked> Any price
                </label>
                <label>
                    <input type="radio" name="threshold-type" value="threshold"> Below market by
                    <input type="number" id="popover-threshold" value="20" min="1" max="99" class="threshold-input">%
                </label>
            </div>
        </div>
        <div class="popover-actions">
            <button id="popover-remove" type="button" class="btn-remove hidden">Remove</button>
            <button id="popover-save" type="button" class="btn-primary">Add to Watchlist</button>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
