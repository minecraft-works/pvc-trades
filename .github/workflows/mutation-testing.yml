name: Mutation Testing

on:
  schedule:
    - cron: '0 4 * * 1'
  pull_request:
    branches: [main]
    paths:
      - 'src/library.ts'
      - 'src/library.test.ts'
      - 'src/library.property.test.ts'
  workflow_dispatch:
    inputs:
      mutate_pattern:
        description: 'Files to mutate (glob pattern)'
        required: false
        default: 'src/library.ts'
        type: string

jobs:
  mutation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Don't block other workflows - this is informational
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Stryker mutation testing
        run: npx stryker run --mutate "${{ github.event.inputs.mutate_pattern || 'src/library.ts' }}"
        env:
          CI: true

      - name: Upload mutation report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: stryker-report
          path: reports/mutation/
          retention-days: 30
