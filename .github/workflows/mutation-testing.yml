name: Mutation Testing

on:
  schedule:
    - cron: '0 4 * * 1'
  pull_request:
    branches: [main]
    paths:
      - 'src/library.ts'
      - 'src/tile-coords.ts'
      - 'src/valuation/**'
      - 'src/routing/**'
      - 'src/interpolation/**'
      - 'src/dashboard/dashboard-data.ts'
      - 'src/search/deviation.ts'
      - 'src/search/query.ts'
      - 'src/search/shop-filter.ts'
      - 'src/stores/**'
      - 'stryker.config.mjs'
  workflow_dispatch:
    inputs:
      mutate_pattern:
        description: 'Files to mutate (glob pattern); empty = the list in stryker.config.mjs'
        required: false
        default: ''
        type: string

jobs:
  mutation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Informational: never blocks other workflows
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Stryker mutation testing
        run: npx stryker run ${{ github.event.inputs.mutate_pattern && format('--mutate "{0}"', github.event.inputs.mutate_pattern) || '' }}
        env:
          CI: true

      - name: Upload mutation report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: stryker-report
          path: reports/mutation/
          retention-days: 30
