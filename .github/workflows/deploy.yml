name: Deploy to GitHub Pages

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Lint TypeScript
        run: npm run lint

      - name: Lint CSS
        run: npm run lint:css

      - name: Lint HTML
        run: npm run lint:html

      - name: Lint file naming conventions
        run: npm run lint:filenames

      - name: Lint lockfile security
        run: npm run lint:lockfile

      - name: Check dependency architecture
        run: npm run lint:deps

      - name: Check circular dependencies
        run: npm run lint:circular

      - name: Parse safety check
        run: npm run lint:parse-safety

      - name: Check eslint-disable budget
        run: |
          COUNT=$(grep -rc 'eslint-disable' src/ --include='*.ts' | awk -F: '{s+=$2}END{print s}')
          BUDGET=0
          echo "eslint-disable count: $COUNT (budget: $BUDGET)"
          if [ "$COUNT" -gt "$BUDGET" ]; then
            echo "::error::eslint-disable budget exceeded: $COUNT > $BUDGET"
            exit 1
          fi

      - name: Check for dead code
        run: npm run knip

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Source tiles: fetched from Dynmap — stable key, only busted if fetch structure changes
      - name: Restore source tile cache
        id: source-tile-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: public/tiles-src
          key: map-tiles-src-v1-${{ github.run_id }}
          restore-keys: |
            map-tiles-src-v1-

      # Canonical tiles: rendered output — key includes format; bump on format/pyramid changes
      - name: Restore canonical tile cache
        id: canonical-tile-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: public/tiles
          key: map-tiles-canonical-png-v5-${{ github.run_id }}
          restore-keys: |
            map-tiles-canonical-png-v5-

      - name: Fetch trade data
        run: npm run fetch-data

      - name: Fetch map tiles (only missing)
        run: npm run fetch-tiles

      - name: Render canonical tiles
        env:
          RENDER_CONCURRENCY: 2
        run: npm run render-tiles

      - name: Validate tile integrity
        run: npm run validate-tiles

      - name: Save source tile cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: public/tiles-src
          key: map-tiles-src-v1-${{ github.run_id }}

      - name: Save canonical tile cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: public/tiles
          key: map-tiles-canonical-png-v5-${{ github.run_id }}

      - name: Copy static JSON files to public
        run: |
          mkdir -p public
          cp config.json public/
          cp trade_conversions.json public/
          cp core_currencies.json public/
          cp block_conversions.json public/

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4