name: Deploy to GitHub Pages

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint TypeScript
        run: npm run lint

      - name: Lint CSS
        run: npm run lint:css

      - name: Lint HTML
        run: npm run lint:html

      - name: Run tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Lint TypeScript
        run: npm run lint

      - name: Lint CSS
        run: npm run lint:css

      - name: Lint HTML
        run: npm run lint:html

      - name: Run unit tests
        run: npm test

      - name: Run E2E layout tests
        run: npm run test:e2e

      - name: Cache map tiles
        uses: actions/cache@v5
        with:
          path: public/tiles
          key: map-tiles-v5-pyramid
          restore-keys: |
            map-tiles-v5-

      - name: Fetch map tiles (only missing)
        run: npm run fetch-tiles

      - name: Copy static JSON files to public
        run: |
          mkdir -p public
          cp config.json public/
          cp trade_conversions.json public/
          cp core_currencies.json public/
          cp block_conversions.json public/

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4