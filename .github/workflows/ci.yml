name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: TypeScript type check
        run: npm run typecheck

      - name: Lint TypeScript
        run: npm run lint

      - name: Lint CSS
        run: npm run lint:css

      - name: Lint HTML
        run: npm run lint:html

      - name: Lint file naming conventions
        run: npm run lint:filenames

      - name: Lint lockfile security
        run: npm run lint:lockfile

      - name: Check dependency architecture
        run: npm run lint:deps

      - name: Check circular dependencies
        run: npm run lint:circular

      - name: Parse safety check
        run: npm run lint:parse-safety

      - name: Check eslint-disable budget
        run: |
          COUNT=$(grep -rc 'eslint-disable' src/ --include='*.ts' | awk -F: '{s+=$2}END{print s}')
          BUDGET=40
          echo "eslint-disable count: $COUNT (budget: $BUDGET)"
          if [ "$COUNT" -gt "$BUDGET" ]; then
            echo "::error::eslint-disable budget exceeded: $COUNT > $BUDGET"
            exit 1
          fi

      - name: Dead code detection
        run: npm run knip

      - name: Run unit tests
        run: npm test

      - name: Run E2E and BDD tests
        run: npx bddgen && npx playwright test --project=chromium --grep-invert "@visual|@wip" && npx playwright test --project=chromium-spec

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/playwright-results.json
            reports/cucumber-report.html
            playwright-report/
          retention-days: 30

      - name: Build for production
        run: npm run build

      - name: Check bundle size (warning at 100kB)
        run: |
          SIZE_JSON=$(npx size-limit --json 2>/dev/null || true)
          SIZE_BYTES=$(echo "$SIZE_JSON" | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');const j=JSON.parse(d);console.log(j[0].size)")
          SIZE_KB=$((SIZE_BYTES / 1024))
          echo "Bundle size: ${SIZE_KB} kB"
          if [ "$SIZE_KB" -gt 100 ]; then
            echo "::warning::Bundle size is ${SIZE_KB} kB (warning threshold: 100 kB)"
          fi

      - name: Check bundle size
        run: npx size-limit

      - name: Generate API documentation
        run: npm run docs

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./lighthouserc.json
